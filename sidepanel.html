<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <h1 id="panel-title">DILLIGAD</h1>
    <div class="tabs">
      <div role="tablist" aria-labelledby="panel-title">
        <button id="barn" type="button" role="tab" aria-selected="true"
          aria-controls="barn-panel" class="tab active" data-tab="barn"
        >🏠 Barn</button>
        <button id="settings" type="button" role="tab" aria-selected="false"
          aria-controls="settings-panel" tabindex="-1" class="tab" data-tab="settings"
        >⚙️ Settings</button>
      </div>
      <div id="barn-panel" role="tabpanel" tabindex="0" aria-labelledby="barn">
        Duck Barn
      </div>
      <div id="settings-panel" role="tabpanel" tabindex="0" aria-labelledby="settings">
        Settings
      </div>
    </div>
  </body>
</html>
