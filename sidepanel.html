<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <h1 id="panel-title" class="visually-hidden">DILLIGAD</h1>

    <div class="header" role="tablist" aria-labelledby="panel-title">
      <button id="tab-barn"
              class="tab active"
              role="tab"
              type="button"
              aria-selected="true"
              aria-controls="panel-barn">
        🏠 Barn
      </button>
      <button id="tab-settings"
              class="tab"
              role="tab"
              type="button"
              aria-selected="false"
              aria-controls="panel-settings"
              tabindex="-1">
        ⚙️ Settings
      </button>
    </div>
    <div class="content">
    <div id="panel-barn"
         class="panel active"
         role="tabpanel"
         aria-labelledby="tab-barn"
         tabindex="0">
      <div>
        Duck Barn
      </div>
    </div>
    <div id="panel-settings"
         class="panel"
         role="tabpanel"
         aria-labelledby="tab-settings"
         tabindex="0">
      <div>
        Settings
      </div>
    </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
